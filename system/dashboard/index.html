<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault Memory</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10); --hover: rgba(11,11,11,.045);
  --sel: rgba(42,120,214,.10); --focus: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --other: #b3b1a9; --neutral-bar: #9b9991; --cell-empty: #efeee9;
  --q1: #cde2fb; --q2: #9ec5f4; --q3: #6da7ec; --q4: #3987e5; --q5: #256abf; --q6: #184f95; --q7: #0d366b;
  --warning: #fab219; --tip-bg: #ffffff; --shadow: 0 6px 24px rgba(11,11,11,.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10); --hover: rgba(255,255,255,.05);
    --sel: rgba(57,135,229,.16); --focus: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9;
    --other: #64635e; --neutral-bar: #7a7872; --cell-empty: #242423;
    --q1: #104281; --q2: #184f95; --q3: #256abf; --q4: #2a78d6; --q5: #5598e7; --q6: #86b6ef; --q7: #b7d3f6;
    --tip-bg: #232322; --shadow: 0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10); --hover: rgba(255,255,255,.05);
  --sel: rgba(57,135,229,.16); --focus: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9;
  --other: #64635e; --neutral-bar: #7a7872; --cell-empty: #242423;
  --q1: #104281; --q2: #184f95; --q3: #256abf; --q4: #2a78d6; --q5: #5598e7; --q6: #86b6ef; --q7: #b7d3f6;
  --tip-bg: #232322; --shadow: 0 6px 24px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }

/* header */
header { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; margin-bottom: 14px; }
header h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
header .meta { font-size: 12.5px; color: var(--ink-2); flex: 1 1 320px; min-width: 0; }
header .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
.btn:hover { background: var(--hover); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn:focus-visible, .chip:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.banner .ico { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.banner p { margin: 0; }
.banner p + p { margin-top: 4px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 1px 7px; border-radius: 99px; background: var(--sel); color: var(--ink); vertical-align: 2px; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 16px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--ring); border-radius: 9px; padding: 2px; flex-wrap: wrap; }
.chip { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--ink); font-weight: 600; }
.seg.lang .chip { padding: 4px 9px; font-size: 12.5px; }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.field input, .field select, .search { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 5px 8px; font-size: 13px; min-width: 0; }
.search { width: 210px; }
.field select { max-width: 220px; }

/* summary */
.kpis { display: grid; grid-template-columns: minmax(260px, 1.5fr) repeat(4, minmax(130px, 1fr)); gap: 12px; margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
.kpi .label { font-size: 12.5px; color: var(--ink-2); }
.kpi .value { font-size: 26px; font-weight: 600; margin-top: 4px; letter-spacing: -.01em; }
.kpi.hero .value { font-size: 40px; line-height: 1.1; letter-spacing: -.02em; white-space: nowrap; }
.kpi .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.span2 { grid-column: 1 / -1; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0; }
.card .desc { font-size: 12px; color: var(--muted); margin: 2px 0 12px; }
.card-head { display: flex; justify-content: space-between; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; }
.card-head .right { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.card-head .right .desc { margin: 0; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
.loading .grid, .loading .kpis { opacity: .55; transition: opacity .15s; }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 10px; font-size: 12.5px; color: var(--ink-2); }
.legend button { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 2px 0; cursor: pointer; color: inherit; }
.legend button:hover { color: var(--ink); }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.legend button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }

/* horizontal bars */
.hbars { display: grid; grid-template-columns: minmax(90px, 170px) 1fr auto; column-gap: 10px; align-items: center; }
.hbars .row { display: contents; cursor: pointer; }
.hbars .name { font-size: 12.5px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 3px 0; }
.hbars .track { height: 24px; display: flex; align-items: center; border-left: 1px solid var(--axis); }
.hbars .bar { height: 14px; border-radius: 0 4px 4px 0; min-width: 2px; }
.hbars .val { font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hbars .val small { color: var(--muted); margin-left: 6px; font-size: 11.5px; }
.hbars .row:hover .bar, .hbars .row:focus-within .bar, .hbars .row.on .bar { filter: brightness(1.12) saturate(1.05); }
.hbars .row.dim .bar { opacity: .35; }
.hbars .row.on .name { font-weight: 600; }
.sub-h { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 4px 0 6px; }
.sub-h + .hbars { margin-bottom: 14px; }

svg { display: block; overflow: visible; }
svg text { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
svg .lbl { fill: var(--ink-2); font-weight: 600; }
.band { cursor: default; }
.band .hit { fill: transparent; }
.band:hover .hit, .band:focus .hit { fill: var(--hover); }
.cols.hovering .band:not(:hover):not(:focus) .seg { opacity: .55; }
.cell { cursor: default; }
.cell:hover, .cell:focus { stroke: var(--ink); stroke-width: 1.5px; }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; cursor: pointer; user-select: none; }
th.r, td.r { text-align: right; }
td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.num { white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tbody tr.on { background: var(--sel); }
.tablewrap { overflow-x: auto; }
.pname { display: inline-flex; align-items: center; gap: 8px; }
.pname .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--ring); color: var(--ink-2); }

/* session list */
.sess { border-top: 1px solid var(--grid); }
.sess details { border-bottom: 1px solid var(--grid); }
.sess summary { list-style: none; display: grid; grid-template-columns: 96px 46px minmax(110px, 180px) 84px 1fr; gap: 10px; padding: 8px 6px; cursor: pointer; align-items: baseline; font-size: 13px; }
.sess summary::-webkit-details-marker { display: none; }
.sess summary:hover { background: var(--hover); }
.sess details[open] summary { background: var(--sel); }
.sess .title { min-width: 0; }
.sess .body { padding: 8px 12px 14px 112px; font-size: 13px; color: var(--ink-2); }
.sess .body h4 { font-size: 12px; color: var(--ink); margin: 10px 0 4px; }
.sess .body ul { margin: 0; padding-left: 18px; }
.sess .body li { margin: 2px 0; }
.sess .body a { color: var(--focus); word-break: break-all; }
.more { margin-top: 10px; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--hover); padding: 0 4px; border-radius: 4px; }

/* project detail */
.pd-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 12px; }
.pd-grid ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.pd-grid li { margin: 3px 0; }
.pd-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pd-top h2 { font-size: 16px; }
.pd-desc { font-size: 13px; color: var(--ink-2); margin: 6px 0 0; }
.pd-links { font-size: 12.5px; margin-top: 6px; }
.pd-links a { color: var(--focus); }

/* tooltip */
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--tip-bg); border: 1px solid var(--ring); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12.5px; min-width: 140px; max-width: 320px; opacity: 0; transition: opacity .08s; }
.tip.show { opacity: 1; }
.tip .tt { color: var(--ink-2); font-size: 12px; margin-bottom: 4px; }
.tip .tr { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
.tip .key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip .tr strong { font-weight: 650; font-variant-numeric: tabular-nums; }
.tip .tr span.l { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip .tf { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

.scale { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.scale i { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }

@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis .hero { grid-column: 1 / -1; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .pd-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .sess summary { grid-template-columns: 84px 1fr auto; }
  .sess summary .c-time { display: none; }
  .sess summary .title { grid-column: 1 / -1; }
  .sess .body { padding-left: 10px; }
  .kpi.hero .value { font-size: 34px; }
  .kpi .value { font-size: 21px; }
  .search { width: 100%; }
  header .meta { flex-basis: 100%; order: 3; }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1 id="h1">Vault Memory</h1>
    <div class="meta" id="meta"></div>
    <div class="actions">
      <button class="btn" id="refresh" type="button" data-i18n="refresh"></button>
      <button class="btn" id="theme" type="button" data-i18n="theme" data-i18n-attr="aria-label:themeAria"></button>
      <div class="seg lang" id="lang" role="group" data-i18n-attr="aria-label:language">
        <button class="chip" type="button" data-lang="en" lang="en" aria-label="English">EN</button>
        <button class="chip" type="button" data-lang="tr" lang="tr" aria-label="Türkçe">TR</button>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" role="status" hidden>
    <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 18.5 17h-17z" fill="var(--warning)"/><rect x="9.1" y="7.5" width="1.8" height="5" rx=".9" fill="#0b0b0b"/><circle cx="10" cy="14.6" r="1" fill="#0b0b0b"/></svg>
    <div id="bannerText"></div>
  </div>

  <div class="filters" role="group" data-i18n-attr="aria-label:filters">
    <div class="seg" id="presets"></div>
    <label class="field"><span data-i18n="from"></span> <input type="date" id="from"></label>
    <label class="field"><span data-i18n="to"></span> <input type="date" id="to"></label>
    <label class="field"><span data-i18n="project"></span> <select id="fproject"></select></label>
    <label class="field"><span data-i18n="machine"></span> <select id="fmachine"></select></label>
    <label class="field" id="toolField"><span data-i18n="tool"></span> <select id="ftool"></select></label>
    <input class="search" type="search" id="q" data-i18n-attr="placeholder:searchPh,aria-label:searchPh">
    <button class="btn" id="reset" type="button" data-i18n="reset"></button>
  </div>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card span2" id="projectDetail" hidden></div>

    <div class="card span2">
      <div class="card-head"><h2 id="dailyTitle"></h2><span class="desc" id="dailyNote"></span></div>
      <p class="desc" data-i18n="dailyDesc"></p>
      <div class="legend" id="dailyLegend"></div>
      <div id="daily"></div>
    </div>

    <div class="card">
      <h2 data-i18n="byProject"></h2>
      <p class="desc" data-i18n="byProjectDesc"></p>
      <div id="byProject"></div>
    </div>

    <div class="card">
      <h2 data-i18n="heat"></h2>
      <p class="desc" data-i18n="heatDesc"></p>
      <div id="heat"></div>
    </div>

    <div class="card">
      <h2 data-i18n="dims"></h2>
      <p class="desc" data-i18n="dimsDesc"></p>
      <div id="dims"></div>
    </div>

    <div class="card">
      <h2 data-i18n="hist"></h2>
      <p class="desc" data-i18n="histDesc"></p>
      <div id="hist"></div>
    </div>

    <div class="card span2">
      <div class="card-head"><h2 data-i18n="projects"></h2><span class="desc" data-i18n="sortHint"></span></div>
      <div class="tablewrap"><table id="ptable"></table></div>
    </div>

    <div class="card span2">
      <div class="card-head">
        <h2 data-i18n="sessions"></h2>
        <div class="right"><span class="desc" id="sessCount"></span><button class="btn sm" id="csv" type="button" data-i18n="csv"></button></div>
      </div>
      <div class="sess" id="sessions"></div>
    </div>
  </section>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
"use strict";
// ---------- strings ----------
const I18N = {
  en: {
    locale: "en-US", title: "Vault Memory", refresh: "Refresh", theme: "Theme", themeAria: "Toggle light and dark theme",

    all: "All", searchPh: "Search sessions…", reset: "Clear filters", reading: "Reading the vault…",

    sessions: "Sessions", sessCount: (n, q) => `${n} records${q ? ` · search "${q}"` : ""}`, noSessions: "No sessions match these filters.",
    sec: { request: "Request", done: "Done", decisions: "Decisions", open: "Open items", other: "Other", source: "Source" },
    showMore: (n) => `Show ${n} more`, csv: "Export CSV",
    csvCols: ["date", "start", "project", "machine", "tool", "minutes", "title"],
    meta: (v, a, b, n, t) => `Vault: ${v} · records ${a} – ${b} · ${n} session records · read at ${t}`,
    metaDemo: "Demo data", workerLast: (t) => `worker log ${t}`, statusErr: "worker status unavailable",

  tr: {

    language: "Dil", filters: "Filtreler", from: "Başlangıç", to: "Bitiş", project: "Proje", machine: "Makine", tool: "Araç",
    all: "Tümü", searchPh: "Oturumlarda ara…", reset: "Filtreleri temizle", reading: "Vault okunuyor…",
    presets: { today: "Bugün", thisWeek: "Bu hafta", lastWeek: "Geçen hafta", last7: "Son 7 gün", last30: "Son 30 gün", thisMonth: "Bu ay", all: "Tümü" },
    min: (m) => `${m} dk`, hm: (h, m) => (m ? `${h} sa ${String(m).padStart(2, "0")} dk` : `${h} sa`), hShort: (x) => `${x} sa`,

// ---------- data ----------

      s.project, (data.projects[s.project] || {}).title].join(" "));

  const ranked = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);

// ---------- KPI tiles ----------

// ---------- daily stacked columns ----------

    const gx = m.l + i * band;

// ---------- heatmap ----------
function renderHeat(rows) {
  const host = $("heat"); host.replaceChildren();
  const grid = Array.from({ length: 7 }, () => Array(24).fill(0));
  for (const s of rows) {
    if (!s.start) continue;
    const [h, mi] = s.start.split(":").map(Number);
    let wd = weekday(s.date), t = h * 60 + mi, left = s.minutes;
    while (left > 0) {
      const hour = Math.floor(t / 60) % 24, take = Math.min(60 - (t % 60), left);
      grid[wd][hour] += take; left -= take; t += take;
      if (t >= 1440) { t -= 1440; wd = (wd + 1) % 7; }
    }
  }
  const max = Math.max(0, ...grid.flat());
  if (!max) { host.append(el("div", { class: "empty" }, T("noData"))); return; }
  const W = Math.max(280, host.clientWidth), lw = 38, rw = 62, ch = 22, gap = 2, top = 4;
  const cw = (W - lw - rw) / 24;
  const H = top + 7 * (ch + gap) + 20;
  const svg = sv("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": T("heatAria") });
  const qOf = (v) => (v <= 0 ? "var(--cell-empty)" : `var(--q${Math.min(7, Math.max(1, Math.ceil(v / max * 7)))})`);
  for (let d = 0; d < 7; d++) {
    const yy = top + d * (ch + gap);
    const lt = sv("text", { x: 0, y: yy + ch / 2 + 4 }, svg); lt.textContent = FMT.wd[d];
    for (let h = 0; h < 24; h++) {
      const v = grid[d][h];
      const c = sv("rect", { class: "cell", x: lw + h * cw + gap / 2, y: yy, width: Math.max(1, cw - gap), height: ch, rx: 3,
        style: `fill:${qOf(v)}`, tabindex: v ? 0 : -1 }, svg);
      hoverable(c, (e) => showTip(e, `${FMT.wdFull[d]} ${pad(h)}:00–${pad((h + 1) % 24)}:00`, [{ value: v ? fmtMin(v) : T("noRecords") }]));
    }
    const tot = sum(grid[d], (x) => x);
    const tt = sv("text", { x: W, y: yy + ch / 2 + 4, "text-anchor": "end", class: tot ? "lbl num" : "num" }, svg);
    tt.textContent = !tot ? "—" : tot < 60 ? L().min(tot) : fmtHours(tot);
  }
  for (let h = 0; h < 24; h += 3) {
    const t = sv("text", { x: lw + h * cw + cw / 2, y: H - 4, "text-anchor": "middle", class: "num" }, svg);
    t.textContent = pad(h);
  }
  host.append(svg);
  const scale = el("div", { class: "scale" }, T("less"));
  for (let i = 1; i <= 7; i++) scale.append(el("i", { style: `background:var(--q${i})` }));
  scale.append(T("more", fmtMin(max)));
  host.append(scale);
}

function renderHist(rows) {
  const host = $("hist"); host.replaceChildren();
  const edges = [[0, 15], [15, 30], [30, 60], [60, 120], [120, 240], [240, Infinity]];
  const bins = edges.map(([a, b], i) => ({ l: L().bins[i], ls: L().binsShort[i], n: 0, m: 0, a, b }));
  for (const s of rows) { const bin = bins.find((x) => s.minutes >= x.a && s.minutes < x.b); bin.n += 1; bin.m += s.minutes; }
  const maxN = Math.max(0, ...bins.map((b) => b.n));

  const W = Math.max(260, host.clientWidth), H = 200, m = { l: 6, r: 6, t: 20, b: 24 };

  sv("line", { x1: m.l, x2: W - m.r, y1: m.t + ih, y2: m.t + ih, stroke: "var(--axis)", "shape-rendering": "crispEdges" }, svg);

// ---------- CSV export ----------
function exportCsv() {
  const rows = filtered();
  if (!rows.length) return;
  const cell = (v) => {
    let s = String(v == null ? "" : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // keep spreadsheets from evaluating text as a formula
    return /[",\n\r;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const lines = [L().csvCols.join(",")];
  for (const s of rows) lines.push([s.date, s.start, projTitle(s.project), s.machine, s.tool, s.minutes, s.title].map(cell).join(","));
  const blob = new Blob(["﻿" + lines.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `vault-memory-sessions_${st.from}_${st.to}.csv` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

    const changed = first || data.generated !== DATA.generated || manual;
    // The page polls every minute; redraw only when the data, the worker status or the date changed.
    if (!changed && statusKey === LAST_STATUS && day === LAST_DAY) return;
    STATUS = status;
    LAST_STATUS = statusKey;
    if (changed) {
      DATA = prepare(data);
      if (first) setLang(pickLang(), false);
      buildFilters();
      if (first || st.preset) applyPreset();
    } else if (day !== LAST_DAY && st.preset) {
      applyPreset();
    }
    LAST_DAY = day;
    render();
  } catch (e) {
    $("meta").textContent = T("loadErr", e.message);
  } finally {
    document.body.classList.remove("loading");
  }
}
loadPrefs();
// ?lang=tr&theme=dark (or window.__VM_VIEW__) overrides the saved view for this load, e.g. for screenshots.
(() => {
  let q = {};
  try { q = Object.fromEntries(new URLSearchParams(location.search)); } catch (e) { /* no query */ }
  const v = Object.assign({}, window.__VM_VIEW__ || {}, q);
  if (v.lang === "en" || v.lang === "tr") LANG_SAVED = v.lang;
  if (v.theme === "light" || v.theme === "dark") document.documentElement.dataset.theme = v.theme;
})();
LANG = pickLang();
buildFormatters();
applyStatic();
if (INJECTED) {
  DATA = prepare(INJECTED); STATUS = window.__VM_STATUS__ || window.__PANO_STATUS__ || null;
  setLang(pickLang(), false);
  buildFilters(); applyPreset(); render();
} else {
  $("meta").textContent = T("reading");
  refresh(false);
  setInterval(() => { if (!document.hidden) refresh(false); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
}
</script>
